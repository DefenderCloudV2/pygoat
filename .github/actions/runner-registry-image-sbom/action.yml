name: Runner and registry image SBOMs
description: Scan local Docker images and explicit published digests with optional exclusions, without pulling registry images into Docker.

inputs:
  registry-images:
    description: Optional newline-separated registry/repository@sha256:digest references from build outputs.
    required: false
    default: ""
  registry-platform:
    description: Platform to scan for registry references; invoke separately for each platform of a multi-platform build.
    default: linux/amd64
  scan-local-images:
    description: Scan all local Docker IDs in addition to registry references; set false for discovered-publication-only scans.
    default: "true"
  discovery-report:
    description: Optional report-path from discover-pushed-images, retained beside the SBOMs.
    required: false
  exclude-images:
    description: Optional newline-separated Bash glob patterns matching image tags or repository digest references.
    required: false
    default: ""
  artifact-name:
    description: Optional unique artifact name; set this for matrix jobs.
    required: false
  retention-days:
    description: How many days to retain the GitHub artifact.
    default: "30"

outputs:
  artifact-directory:
    description: Directory containing SPDX and CycloneDX JSON SBOMs and the build/image index.
    value: ${{ steps.scan.outputs.artifact-directory }}

runs:
  using: composite
  steps:
    - name: Install pinned Syft
      id: syft
      if: ${{ !cancelled() }}
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        syft-version: v1.55.0

    - name: Scan local and published images
      id: scan
      if: ${{ !cancelled() && steps.syft.outcome == 'success' }}
      shell: bash
      env:
        SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
        REGISTRY_IMAGES: ${{ inputs.registry-images }}
        REGISTRY_PLATFORM: ${{ inputs.registry-platform }}
        EXCLUDE_IMAGES: ${{ inputs.exclude-images }}
        SCAN_LOCAL_IMAGES: ${{ inputs.scan-local-images }}
        DISCOVERY_REPORT: ${{ inputs.discovery-report }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        state=$(mktemp -d "$RUNNER_TEMP/runner-registry-image-sbom.XXXXXX")
        case "${SCAN_LOCAL_IMAGES:-true}" in
          true) docker image ls --all --quiet --no-trunc | sort -u > "$state/local.txt" ;;
          false) : > "$state/local.txt" ;;
          *) echo "::error::scan-local-images must be true or false."; exit 1 ;;
        esac
        if grep -qvE '^sha256:[0-9a-f]{64}$' "$state/local.txt"; then
          echo "::error::Docker returned an invalid image ID."
          exit 1
        fi
        printf '%s\n' "$REGISTRY_IMAGES" | sed -e 's/\r$//' \
          -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' |
          sort -u > "$state/registry.txt"
        if grep -qvE '^[a-z0-9][a-z0-9.:-]*/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$' "$state/registry.txt"; then
          echo "::error::registry-images must contain registry/repository@sha256:digest references, one per line (no tags or URL schemes)."
          exit 1
        fi
        if [[ ! "$REGISTRY_PLATFORM" =~ ^[a-z0-9]+/[a-z0-9_]+(/[a-z0-9_.-]+)?$ ]]; then
          echo "::error::registry-platform must be os/architecture or os/architecture/variant."
          exit 1
        fi
        printf '%s\n' "${EXCLUDE_IMAGES:-}" | sed -e 's/\r$//' \
          -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' |
          sort -u > "$state/exclusions.txt"
        mapfile -t exclusions < "$state/exclusions.txt"
        sed 's/^/docker:/' "$state/local.txt" > "$state/sources.txt"
        sed 's/^/registry:/' "$state/registry.txt" >> "$state/sources.txt"
        destination="$state/sboms"
        mkdir "$destination"
        failed=0
        if [[ -n "${DISCOVERY_REPORT:-}" ]]; then
          if ! jq -se 'length == 1 and (.[0] |
            .schema_version == 1 and .repository == env.GITHUB_REPOSITORY and
            .run_id == env.GITHUB_RUN_ID and .run_attempt == env.GITHUB_RUN_ATTEMPT and .job == env.GITHUB_JOB and
            (.status == "success" or .status == "failed") and
            (.images | type == "array") and (.errors | type == "array") and (.warnings | type == "array"))
          ' "$DISCOVERY_REPORT" > /dev/null; then
            echo "::error::Invalid discovery report or report from a different job."
            exit 1
          fi
          cp -- "$DISCOVERY_REPORT" "$destination/discovery.json"
          if ! jq -e '.status == "success" and (.errors | length) == 0' "$destination/discovery.json" > /dev/null; then
            echo "::error::Discovery was incomplete; scanning available references and retaining its error report."
            failed=1
          fi
        fi
        echo "artifact-directory=$destination" >> "$GITHUB_OUTPUT"
        records="$state/images.jsonl"
        metadata="$state/image.json"
        syft_json="$state/syft.json"
        : > "$records"
        while IFS= read -r source; do
          kind="${source%%:*}"
          reference="${source#*:}"
          platform_args=()
          platform=""
          if [[ "$kind" == registry ]]; then
            platform="$REGISTRY_PLATFORM"
            platform_args=(--platform "$platform")
            key=$(printf '%s\n%s' "$reference" "$platform" | sha256sum | cut -d ' ' -f 1)
            filename="registry-sha256-$key.spdx.json"
          else
            filename="${reference/:/-}.spdx.json"
          fi
          sbom="$destination/$filename"
          cyclonedx_filename="${filename%.spdx.json}.cdx.json"
          cyclonedx="$destination/$cyclonedx_filename"
          jq -n --arg kind "$kind" --arg reference "$reference" --arg platform "$platform" '
            {source: {type: $kind, reference: $reference,
              requested_platform: (if $platform == "" then null else $platform end)}}' > "$metadata"
          if (( ${#exclusions[@]} > 0 )); then
            if [[ "$kind" == docker ]]; then
              if ! docker image inspect "$reference" | jq -ce '
                select(type == "array" and length == 1) | .[0] | select(type == "object") |
                {tags: (.RepoTags // []), repo_digests: (.RepoDigests // [])} |
                select((.tags | type == "array") and (.repo_digests | type == "array")) |
                select(.tags + .repo_digests | all(.[]; type == "string"))
              ' > "$state/references.json"; then
                echo "::error::Cannot inspect $reference for image exclusions."
                jq -c '. + {status: "failed", error: "Docker inspection for exclusion matching failed."}' \
                  "$metadata" >> "$records"
                failed=1
                continue
              fi
              jq --slurpfile names "$state/references.json" '. + $names[0]' "$metadata" > "$state/filter.json"
              mv "$state/filter.json" "$metadata"
              jq -r '.tags[], .repo_digests[]' "$metadata" | tr -d '\r' > "$state/candidates.txt"
            else
              printf '%s\n' "$reference" > "$state/candidates.txt"
            fi
            excluded=0
            while IFS= read -r candidate; do
              short_reference="${candidate#docker.io/}"
              short_reference="${short_reference#index.docker.io/}"
              for pattern in "${exclusions[@]}"; do
                if [[ "$candidate" == $pattern || "$short_reference" == $pattern ]]; then
                  echo "Excluding $source: $candidate matches $pattern"
                  jq -c --arg pattern "$pattern" --arg reference "$candidate" '
                    . + {status: "excluded", exclusion: {pattern: $pattern, reference: $reference}}
                  ' "$metadata" >> "$records"
                  excluded=1
                  break 2
                fi
              done
            done < "$state/candidates.txt"
            if [[ "$excluded" == 1 ]]; then
              continue
            fi
          fi
          echo "Generating SBOM for $source"
          if timeout 600 "$SYFT_COMMAND" scan "$source" "${platform_args[@]}" \
              --output "spdx-json=$sbom" --output "cyclonedx-json=$cyclonedx" --output "syft-json=$syft_json" &&
            jq -se 'length == 1 and (.[0] | type == "object" and
              .spdxVersion == "SPDX-2.3" and (.packages | type == "array"))' "$sbom" > /dev/null &&
            jq -se 'length == 1 and (.[0] | type == "object" and
              .bomFormat == "CycloneDX" and (.specVersion | type == "string" and length > 0) and
              (.version | type == "number" and . >= 1 and . == floor) and
              ((has("components") | not) or (.components | type == "array")))' "$cyclonedx" > /dev/null &&
            jq -sce --slurpfile base "$metadata" '
              select(length == 1) | .[0].source | select(.type == "image") | .metadata |
              select(.imageID | type == "string" and test("^sha256:[0-9a-f]{64}$")) |
              . as $image | (.config | @base64d | fromjson) as $config |
              $base[0] + {
                image_id: $image.imageID, tags: ($image.tags // []),
                repo_digests: (($image.repoDigests // []) +
                  (if $base[0].source.type == "registry" then [$base[0].source.reference] else [] end) | unique),
                manifest_digest: $image.manifestDigest,
                platform: {os: $image.os, architecture: $image.architecture, variant: $image.architectureVariant},
                image_created_at: $config.created,
                oci_labels: (($image.labels // {}) | with_entries(select(
                  .key == "org.opencontainers.image.source" or
                  .key == "org.opencontainers.image.revision" or
                  .key == "org.opencontainers.image.version")))
              }' "$syft_json" > "$state/enriched.json"; then
            digest=$(sha256sum "$sbom" | cut -d ' ' -f 1)
            cyclonedx_digest=$(sha256sum "$cyclonedx" | cut -d ' ' -f 1)
            jq -c --arg sbom "$filename" --arg digest "$digest" \
              --arg cyclonedx "$cyclonedx_filename" --arg cyclonedx_digest "$cyclonedx_digest" \
              --argjson cyclonedx_size "$(wc -c < "$cyclonedx")" \
              --argjson cyclonedx_components "$(jq '(.components // []) | length' "$cyclonedx")" \
              --arg cyclonedx_version "$(jq -r '.specVersion' "$cyclonedx" | tr -d '\r')" \
              --argjson size "$(wc -c < "$sbom")" --argjson packages "$(jq '.packages | length' "$sbom")" '
              . + {status: "success", sbom: $sbom, sbom_sha256: $digest,
                sbom_size_bytes: $size, packages: $packages,
                cyclonedx: {file: $cyclonedx, sha256: $cyclonedx_digest, size_bytes: $cyclonedx_size,
                  components: $cyclonedx_components, spec_version: $cyclonedx_version}}
            ' "$state/enriched.json" >> "$records"
          else
            echo "::error::SBOM generation failed for $source."
            rm -f -- "$sbom" "$cyclonedx"
            jq -c '. + {status: "failed", error: "Syft failed, timed out, or returned invalid SBOM/image metadata."}' \
              "$metadata" >> "$records"
            failed=1
          fi
          rm -f -- "$syft_json"
        done < "$state/sources.txt"
        jq -n --slurpfile images "$records" --arg scan_id "${state##*/}" \
          --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
          (["repository", "repository_id", "repository_owner_id", "sha", "ref", "workflow",
            "workflow_ref", "workflow_sha", "run_id", "run_attempt", "job", "event_name", "server_url"] |
            map(. as $key | {key: $key, value: env["GITHUB_" + ($key | ascii_upcase)]}) |
            from_entries) as $build |
          {schema_version: 1, scan_id: $scan_id, generated_at: $generated_at,
            build: ($build + {runner: {os: env.RUNNER_OS, arch: env.RUNNER_ARCH},
              run_url: (if $build.server_url and $build.repository and $build.run_id then
                "\($build.server_url)/\($build.repository)/actions/runs/\($build.run_id)" else null end)}),
            images: $images}' > "$destination/index.json"
        count=$(jq '.images | length' "$destination/index.json")
        succeeded=$(jq '[.images[] | select(.status == "success")] | length' "$destination/index.json")
        excluded_count=$(jq '[.images[] | select(.status == "excluded")] | length' "$destination/index.json")
        {
          echo "## Runner and registry image SBOMs"
          echo
          echo "Found $(wc -l < "$state/local.txt") local image IDs and $(wc -l < "$state/registry.txt") registry references; excluded $excluded_count sources; generated $succeeded SPDX/CycloneDX SBOM pairs."
          echo 'The index identifies the source, requested platform, image metadata, and checksums for each scan.'
        } >> "$GITHUB_STEP_SUMMARY"
        if [[ "$count" == 0 ]]; then
          echo "::notice::No local images or registry references found; index.json contains no images."
        fi
        exit "$failed"

    - name: Upload SBOMs and image index to GitHub
      if: ${{ always() && steps.scan.outputs.artifact-directory != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name || format('runner-registry-image-sboms-{0}-{1}-{2}', github.job, github.run_id, github.run_attempt) }}
        path: ${{ steps.scan.outputs.artifact-directory }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
