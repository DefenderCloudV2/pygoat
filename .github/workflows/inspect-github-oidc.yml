name: Inspect GitHub OIDC claims

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Request OIDC token and log decoded claims only
        shell: bash
        env:
          OIDC_AUDIENCE: urn:pygoat:oidc-claims-inspection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          endpoint = urllib.parse.urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          query = urllib.parse.parse_qsl(endpoint.query, keep_blank_values=True)
          query = [(key, value) for key, value in query if key != "audience"]
          query.append(("audience", os.environ["OIDC_AUDIENCE"]))
          url = urllib.parse.urlunsplit(endpoint._replace(query=urllib.parse.urlencode(query)))
          request = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)["value"]
          except Exception as error:
              # Do not log response bodies or request details containing credentials.
              print(f"::error::OIDC token request failed ({type(error).__name__}).", file=sys.stderr)
              sys.exit(1)

          if not isinstance(token, str) or len(token.split(".")) != 3:
              print("::error::OIDC endpoint returned an invalid JWT.", file=sys.stderr)
              sys.exit(1)
          print("::add-mask::" + token, flush=True)

          try:
              payload = token.split(".")[1]
              claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
              if not isinstance(claims, dict):
                  raise ValueError("Expected an object")
          except (ValueError, UnicodeError):
              print("::error::Cannot decode OIDC claims.", file=sys.stderr)
              sys.exit(1)

          print("Decoded claims for inspection only; this step does not verify the JWT signature.")
          print("The bearer token and signature are not logged or uploaded.")
          print("OIDC_CLAIMS_BEGIN")
          print(json.dumps(claims, indent=2, sort_keys=True))
          print("OIDC_CLAIMS_END")
          PY
